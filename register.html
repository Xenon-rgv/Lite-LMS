<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Lite-LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="h-full bg-slate-900 text-slate-100 flex items-center justify-center p-6 selection:bg-brand-500 selection:text-white">

    <div class="w-full max-w-lg my-8">
        <!-- Brand Header -->
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center font-bold text-2xl text-white shadow-lg shadow-brand-500/20">
                    L
                </div>
                <span class="font-extrabold text-2xl tracking-tight text-white">Lite-LMS</span>
            </a>
            <h2 class="text-xl font-bold mt-4 text-slate-200">Register for school portal</h2>
            <p class="text-sm text-slate-400 mt-1">Select your role and enter your institutional credentials</p>
        </div>

        <!-- Registration Card -->
        <div class="bg-slate-800/60 border border-slate-700/70 backdrop-blur rounded-2xl p-8 shadow-2xl">
            <!-- Role Selector Tabs -->
            <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-900/80 rounded-xl mb-6 border border-slate-700/60">
                <button type="button" id="tab-student" onclick="setRole('student')"
                    class="py-2.5 text-xs font-bold rounded-lg transition bg-brand-600 text-white shadow">
                    🎓 Student
                </button>
                <button type="button" id="tab-lecturer" onclick="setRole('lecturer')"
                    class="py-2.5 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">
                    👨‍🏫 Lecturer
                </button>
            </div>

            <!-- Error Banner -->
            <div id="error-box" class="hidden mb-6 p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-sm"></div>

            <!-- Success Banner -->
            <div id="success-box" class="hidden mb-6 p-3.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-sm"></div>

            <form id="register-form" class="space-y-4">
                <input type="hidden" id="role" value="student">

                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. John Doe"
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Institutional Email</label>
                    <input type="email" id="email" required placeholder="john.doe@university.edu"
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500">
                </div>

                <!-- Password & Confirm Password -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                        <input type="password" id="password" required minlength="6" placeholder="Min. 6 chars"
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Confirm</label>
                        <input type="password" id="password_confirm" required minlength="6" placeholder="Repeat password"
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <!-- Department -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Department</label>
                    <select id="department_id" required
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white text-sm focus:outline-none focus:border-brand-500">
                        <option value="">Loading departments...</option>
                    </select>
                </div>

                <!-- Student-specific fields -->
                <div id="student-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Matric Number</label>
                        <input type="text" id="matric_no" placeholder="e.g. CSC/2022/045"
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Academic Level</label>
                        <select id="level"
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white text-sm focus:outline-none focus:border-brand-500">
                            <option value="100">100 Level</option>
                            <option value="200">200 Level</option>
                            <option value="300">300 Level</option>
                            <option value="400">400 Level</option>
                            <option value="500">500 Level</option>
                        </select>
                    </div>
                </div>

                <!-- Lecturer-specific field -->
                <div id="lecturer-fields" class="hidden">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Staff Identification ID</label>
                    <input type="text" id="staff_id" placeholder="e.g. STF-8821"
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500">
                </div>

                <div class="pt-2">
                    <button type="submit" id="submit-btn"
                        class="w-full py-3.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm shadow-lg shadow-brand-600/30 transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                        <span id="btn-text">Create Account</span>
                        <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-700/60 text-center text-sm text-slate-400">
                Already have an account?
                <a href="login.html" class="font-semibold text-brand-400 hover:text-brand-300 ml-1">Sign in here</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        redirectIfLoggedIn();

        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            document.getElementById('role').value = role;

            const studentTab = document.getElementById('tab-student');
            const lecturerTab = document.getElementById('tab-lecturer');
            const studentFields = document.getElementById('student-fields');
            const lecturerFields = document.getElementById('lecturer-fields');
            const matricInput = document.getElementById('matric_no');
            const staffInput = document.getElementById('staff_id');

            if (role === 'student') {
                studentTab.className = "py-2.5 text-xs font-bold rounded-lg transition bg-brand-600 text-white shadow";
                lecturerTab.className = "py-2.5 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white";
                studentFields.classList.remove('hidden');
                lecturerFields.classList.add('hidden');
                matricInput.required = true;
                staffInput.required = false;
            } else {
                lecturerTab.className = "py-2.5 text-xs font-bold rounded-lg transition bg-brand-600 text-white shadow";
                studentTab.className = "py-2.5 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white";
                lecturerFields.classList.remove('hidden');
                studentFields.classList.add('hidden');
                matricInput.required = false;
                staffInput.required = true;
            }
        }

        // Set initial required attributes
        document.getElementById('matric_no').required = true;

        // Fetch departments dynamically from Supabase
        async function loadDepartments() {
            const deptSelect = document.getElementById('department_id');
            if (!supabase) return;

            try {
                const { data, error } = await supabase.from('departments').select('id, name').order('name');
                if (error) throw error;

                deptSelect.innerHTML = '<option value="">Select your department...</option>';
                data.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    deptSelect.appendChild(opt);
                });
            } catch (err) {
                console.error("Error loading departments:", err);
                deptSelect.innerHTML = '<option value="">(Error loading departments)</option>';
            }
        }

        loadDepartments();

        // Registration form handler
        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;
            const departmentId = document.getElementById('department_id').value;
            const matricNo = document.getElementById('matric_no').value.trim();
            const staffId = document.getElementById('staff_id').value.trim();
            const level = document.getElementById('level').value;

            if (password !== passwordConfirm) {
                errorBox.textContent = "Passwords do not match.";
                errorBox.classList.remove('hidden');
                return;
            }

            btnText.textContent = "Creating Account...";
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                const metadata = {
                    name,
                    role: currentRole,
                    department_id: departmentId,
                    matric_no: currentRole === 'student' ? matricNo : null,
                    staff_id: currentRole === 'lecturer' ? staffId : null,
                    level: currentRole === 'student' ? level : null
                };

                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: metadata
                    }
                });

                if (error) throw error;

                successBox.innerHTML = `Account created successfully! ${data.session ? "Redirecting to your dashboard..." : "Please check your email to confirm your account before logging in."}`;
                successBox.classList.remove('hidden');

                if (data.session) {
                    setTimeout(() => {
                        window.location.href = currentRole === 'lecturer' ? 'lecturer/dashboard.html' : 'student/dashboard.html';
                    }, 1200);
                } else {
                    btnText.textContent = "Account Created";
                    btnSpinner.classList.add('hidden');
                }

            } catch (err) {
                console.error("Registration error:", err);
                errorBox.textContent = err.message || "Failed to create account. Please try again.";
                errorBox.classList.remove('hidden');
                btnText.textContent = "Create Account";
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
